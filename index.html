<!doctype html>
<html lang="en" data-vite-base="%BASE_URL%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H1-multilevel — One conversation. Multiple intelligent agents.</title>
    <meta
      name="description"
      content="H1-multilevel is an Autonomous Multi-Agent AI System for Smart Task Coordination and Decision Support. Describe goals in natural language, and specialised AI agents plan, coordinate, execute, verify, and explain recommendations."
    />
    <meta property="og:title" content="H1-multilevel — One conversation. Multiple intelligent agents." />
    <meta
      property="og:description"
      content="Describe goals in natural language, and specialised AI agents plan, coordinate, execute permitted tasks, verify results, and explain recommendations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link id="h1-favicon" rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="text/javascript">
      // 1. Restore clean URL path when redirected from 404.html on GitHub Pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);

      // 2. Fallback loader when GitHub Pages serves raw repository branch instead of dist/
      (function () {
        var rawBaseAttr = document.documentElement.getAttribute('data-vite-base') || '';
        var isUnbuiltBranch = rawBaseAttr.indexOf('%BASE_' + 'URL%') !== -1;
        var basePrefix =
          window.location.pathname.indexOf('/agentflow-ai') === 0 ? '/agentflow-ai' : '';

        window.__loadH1FallbackBundle = function () {
          if (window.__h1FallbackLoaded) return;
          window.__h1FallbackLoaded = true;

          var fav = document.getElementById('h1-favicon');
          if (fav) {
            fav.setAttribute('href', basePrefix + '/public/favicon.svg');
          }

          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = basePrefix + '/public/gh-pages-bundle/app.css';
          document.head.appendChild(css);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = basePrefix + '/public/gh-pages-bundle/app.js';
          document.head.appendChild(script);
        };

        if (isUnbuiltBranch) {
          window.__loadH1FallbackBundle();
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F6] text-[#302C29] antialiased selection:bg-[#FFD6C2] selection:text-[#302C29]">
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
      onerror="window.__loadH1FallbackBundle && window.__loadH1FallbackBundle()"
    ></script>
  </body>
</html>
